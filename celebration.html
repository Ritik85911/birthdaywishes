<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sir</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
height:100vh;
background: radial-gradient(circle at top,#1b2735,#090a0f);
color:white;
text-align:center;
overflow:hidden;
}

.container{
position:relative;
z-index:10;
padding-top:40px;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
border:5px solid white;
object-fit:cover;
box-shadow:0 0 25px #fff,0 0 50px #ff6;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 20px white;}
to{box-shadow:0 0 40px gold;}
}

h1{
font-size:32px;
margin-top:15px;
}

#message{
font-size:18px;
max-width:320px;
margin:15px auto;
line-height:1.6;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff4b5c;
color:white;
font-size:16px;
cursor:pointer;
box-shadow:0 0 15px #ff4b5c;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

/* stars background */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2}
to{opacity:1}
}

/* balloons */

.balloon{
position:absolute;
bottom:-100px;
font-size:35px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-120vh)}
}

/* cake animation */

.cake{
font-size:50px;
margin-top:10px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

</style>

</head>

<body>

<div class="container">

<img src="Dr.jpeg" class="photo">

<h1>🎉 Happy Birthday Sir 🎉</h1>

<div class="cake">🎂</div>

<p id="message"></p>

<button onclick="celebrate()">Send Blessings 🎁</button>

</div>

<script>

/* typing message */

const text=" May this birthday bring you happiness, success and great achievements. Wishing you a wonderful year ahead Sir!";

let i=0;

function type(){

if(i<text.length){

document.getElementById("message").innerHTML+=text.charAt(i);

i++;

setTimeout(type,40);

}

}

type();


/* stars */

for(let i=0;i<80;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}


/* balloons */

function balloon(){

let b=document.createElement("div");

b.className="balloon";

b.innerHTML="🎈";

b.style.left=Math.random()*100+"vw";

document.body.appendChild(b);

setTimeout(()=>{

b.remove();

},8000)

}

setInterval(balloon,600);


/* confetti celebration */

function celebrate(){

for(let i=0;i<120;i++){

let c=document.createElement("div");

c.style.position="absolute";
c.style.width="8px";
c.style.height="8px";
c.style.background="hsl("+Math.random()*360+"deg,100%,50%)";

c.style.left=Math.random()*100+"vw";
c.style.top="-10px";

c.style.transition="top 3s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.style.top="100vh";

},10);

setTimeout(()=>{

c.remove();

},3000)

}

}

</script>

</body>
</html>
